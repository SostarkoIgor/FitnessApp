<header class="app-header" *ngIf="showNav()">
  <span class="app-header__title">{{ title() }}</span>
  <div class="app-header__right">
    <nav class="app-header__nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/leaderboard" routerLinkActive="active">Leaderboard</a>
    </nav>
    <button type="button" class="app-header__logout" (click)="logout()">Log out</button>
  </div>
</header>

<main class="app-main">
  <router-outlet></router-outlet>
</main>
