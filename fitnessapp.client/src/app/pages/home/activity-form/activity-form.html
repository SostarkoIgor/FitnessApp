<div class="modal-backdrop" *ngIf="open()" (click)="close()">
  <form class="activity-card modal-card" [formGroup]="form" (ngSubmit)="submitActivity()" (click)="$event.stopPropagation()">
    <div class="activity-card__head">
      <h2 class="activity-card__title">Log an activity</h2>
      <button type="button" class="modal-card__close" (click)="close()" aria-label="Close">×</button>
    </div>

    <label class="field">
      <span class="field__label">Sport</span>
      <select class="field__input" formControlName="sport">
        <option *ngFor="let option of sportOptions" [value]="option.value">{{ option.label }}</option>
      </select>
      <span class="field__error" *ngIf="form.controls.sport.invalid && form.controls.sport.touched">
        Please choose a sport.
      </span>
    </label>

    <label class="field">
      <span class="field__label">When</span>
      <input class="field__input" type="datetime-local" formControlName="datetime" [max]="maxDatetime" />
      <span class="field__error" *ngIf="form.controls.datetime.invalid && form.controls.datetime.touched">
        <ng-container *ngIf="form.controls.datetime.errors?.['required']">Please choose a date and time.</ng-container>
        <ng-container *ngIf="form.controls.datetime.errors?.['futureDate']">Date can't be in the future.</ng-container>
      </span>
    </label>

    <label class="field" *ngIf="selectedMetric() === 'distance'">
      <span class="field__label">Distance (km)</span>
      <input class="field__input" type="number" step="0.01" min="0.01" formControlName="distance" />
      <span class="field__error" *ngIf="form.controls.distance.invalid && form.controls.distance.touched">
        <ng-container *ngIf="form.controls.distance.errors?.['required']">Distance is required.</ng-container>
        <ng-container *ngIf="form.controls.distance.errors?.['min']">Distance must be greater than 0.</ng-container>
      </span>
    </label>

    <label class="field" *ngIf="selectedMetric() === 'duration'">
      <span class="field__label">Duration (mm:ss)</span>
      <input class="field__input" type="text" placeholder="45:30" formControlName="duration" />
      <span class="field__error" *ngIf="form.controls.duration.invalid && form.controls.duration.touched">
        <ng-container *ngIf="form.controls.duration.errors?.['required']">Duration is required.</ng-container>
        <ng-container *ngIf="form.controls.duration.errors?.['pattern']">Use mm:ss format, e.g. 45:30.</ng-container>
      </span>
    </label>

    <label class="field" *ngIf="selectedMetric() === 'steps'">
      <span class="field__label">Steps</span>
      <input class="field__input" type="number" step="1" min="1" formControlName="steps" />
      <span class="field__error" *ngIf="form.controls.steps.invalid && form.controls.steps.touched">
        <ng-container *ngIf="form.controls.steps.errors?.['required']">Steps are required.</ng-container>
        <ng-container *ngIf="form.controls.steps.errors?.['min']">Steps must be at least 1.</ng-container>
      </span>
    </label>

    <ul class="activity-card__errors" *ngIf="activityErrors().length">
      <li *ngFor="let err of activityErrors()">{{ err }}</li>
    </ul>

    <p class="activity-card__success" *ngIf="activitySuccess()">Activity added.</p>

    <button class="activity-card__submit" type="submit" [disabled]="submittingActivity()">
      {{ submittingActivity() ? 'Adding…' : 'Add activity' }}
    </button>
  </form>
</div>
