<section class="home">
  <div *ngIf="loading()" class="home__status">Loading your points…</div>

  <div *ngIf="!loading() && error()" class="home__status home__status--error">
    Couldn't load your points. Please try again later.
  </div>

  <div class="home__container" *ngIf="!loading() && !error()">
    <app-summary-banner
      *ngIf="user() as u"
      [user]="u"
      [streak]="stats()?.currentStreak ?? 0"
      (logActivity)="openLogForm()"
      (viewActivities)="openAllActivities()"
    ></app-summary-banner>

    <ng-container *ngIf="!statsLoading() && stats() as s">
      <div class="home__grid" *ngIf="hasActivities()">
        <app-stat-tiles
          [totalActivities]="s.totalActivities"
          [totalDistance]="s.totalDistance"
          [averagePoints]="s.averagePoints"
          [topSport]="s.topSport"
          [bestDay]="s.bestDay"
        ></app-stat-tiles>
        <app-progression-chart [dailyPoints]="s.dailyPointsSeries"></app-progression-chart>
        <app-sport-breakdown [breakdown]="s.sportBreakdown" [sportOrder]="sportOrder()"></app-sport-breakdown>
        <app-weekly-chart [last7Days]="s.last7Days"></app-weekly-chart>
        <app-recent-activities [recent]="s.recentActivities"></app-recent-activities>
      </div>

      <app-sport-detail
        *ngIf="hasActivities()"
        [sportChoices]="sportChoices()"
        [refreshToken]="refreshToken()"
      ></app-sport-detail>

      <p class="stats__empty" *ngIf="!hasActivities()">
        Log your first activity to start seeing your stats here.
      </p>
    </ng-container>
  </div>
</section>

<app-activity-form
  [open]="showLogForm()"
  (closed)="closeLogForm()"
  (activityAdded)="onActivityAdded()"
></app-activity-form>

<app-all-activities-modal
  [open]="showAllActivities()"
  (closed)="closeAllActivities()"
></app-all-activities-modal>
