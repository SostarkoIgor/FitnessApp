<section class="home">
  <div *ngIf="loading()" class="home__status">Loading your points…</div>

  <div *ngIf="!loading() && error()" class="home__status home__status--error">
    Couldn't load your points. Please try again later.
  </div>

  <div class="home__container" *ngIf="!loading() && !error()">
    <app-summary-banner
      *ngIf="user() as u"
      [user]="u"
      [streak]="currentStreak()"
      (logActivity)="openLogForm()"
    ></app-summary-banner>

    <ng-container *ngIf="!statsLoading()">
      <div class="home__grid" *ngIf="hasActivities()">
        <app-stat-tiles [activities]="activities()"></app-stat-tiles>
        <app-progression-chart [activities]="activities()"></app-progression-chart>
        <app-sport-breakdown [activities]="activities()"></app-sport-breakdown>
        <app-weekly-chart [activities]="activities()"></app-weekly-chart>
        <app-recent-activities [activities]="activities()"></app-recent-activities>
      </div>

      <app-sport-detail *ngIf="hasActivities()" [activities]="activities()"></app-sport-detail>

      <p class="stats__empty" *ngIf="!hasActivities()">
        Log your first activity to start seeing your stats here.
      </p>
    </ng-container>
  </div>
</section>

<app-activity-form
  [open]="showLogForm()"
  (closed)="closeLogForm()"
  (activityAdded)="onActivityAdded()"
></app-activity-form>
