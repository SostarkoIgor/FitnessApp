<div class="chart-card" *ngIf="progression().length > 1">
  <h2 class="chart-card__title">Score progression</h2>
  <div class="chart-card__body">
    <div class="chart-card__yaxis">
      <span *ngFor="let lbl of progressionYAxis()">{{ lbl }}</span>
    </div>
    <div class="chart-card__plot">
      <svg viewBox="0 0 280 120" class="chart-card__svg" preserveAspectRatio="none">
        <line class="chart-card__gridline" x1="0" y1="4" x2="280" y2="4" />
        <line class="chart-card__gridline" x1="0" y1="60" x2="280" y2="60" />
        <line class="chart-card__gridline" x1="0" y1="116" x2="280" y2="116" />
        <path
          [attr.d]="progressionPath()"
          fill="none"
          stroke="var(--color-violet)"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <div class="chart-card__axis">
        <span
          *ngFor="let lbl of progressionLabels(); let first = first; let last = last"
          [class.chart-card__axis-label--first]="first"
          [class.chart-card__axis-label--last]="last"
          [style.left.%]="lbl.pct"
        >{{ lbl.text }}</span>
      </div>
    </div>
  </div>
</div>
