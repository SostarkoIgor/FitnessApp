<div class="summary-banner">
  <div class="summary-banner__intro">
    <p class="summary-banner__greeting">Welcome back, {{ user().firstName }}!</p>
    <div class="summary-banner__points-row">
      <span class="summary-banner__points">{{ user().points }}</span>
      <span class="summary-banner__label">points</span>
    </div>
  </div>

  <div class="summary-banner__actions">
    <span class="summary-banner__streak" *ngIf="streak() > 0">{{ streak() }}-day streak</span>
    <a class="summary-banner__link" routerLink="/leaderboard">See global leaderboard →</a>
    <button type="button" class="summary-banner__cta" (click)="logActivity.emit()">+ Log activity</button>
  </div>
</div>
